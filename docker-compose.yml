services:
  postgres:
    image: postgres:17-alpine
    container_name: db_clean_tasks
    environment:
      POSTGRES_DB: clean_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: